<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spendly</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <header>
      <div class="header-logo-div">
        <i data-lucide="wallet"></i>
        <h1>Spendly</h1>
      </div>
      <div class="header-date-div">
        <i data-lucide="calendar"></i>
        <p id="heading-date">date</p>
      </div>
    </header>
    <section class="section1-top">
      <div class="section1-card-div card1">
        <div class="card-p">
          <p id="s1-p">Intial Balance</p>
        </div>
        <div class="balance-div">
          <div class="section1-card1-img">
            <span>₹</span>
          </div>
          <input
            type="number"
            id="initial-balance-input"
            placeholder="Enter Your Amount"
          />
        </div>
      </div>
      <div class="section1-card-div card2">
        <div class="card-p">
          <p id="s1-p">Total Expences</p>
        </div>
        <div class="card-matter">
          <div class="card-matter-p amt-p">
            <p id="amount_spent">₹ 12,450.00</p>
          </div>

          <div class="icon-container">
            <i data-lucide="chart-line"></i>
          </div>
        </div>
      </div>
      <div class="section1-card-div card3">
        <div class="card-p">
          <p id="s1-p">Category Total</p>
        </div>
        <div class="card-matter">
          <div class="card-matter-p amt-p Category-p">
            <p id="category_total">₹4,250.00</p>
          </div>

          <div class="icon-container Category">
            <i data-lucide="pie-chart"></i>
          </div>
        </div>
      </div>
      <div class="section1-card-div card4">
        <div class="card-p">
          <p id="#s1-p" style="font-size: 20px">Balance</p>
        </div>
        <div class="card-matter">
          <div class="balance-p amt-p">
            <p id="balance">₹ 12,450.00</p>
          </div>

          <div class="icon-container balance">
            <i data-lucide="wallet"></i>
          </div>
        </div>
      </div>
    </section>

    <section class="section2-top">
      <div class="section2-top-div">
        <div class="s2-heading">
          <h1>Add New Expences</h1>
        </div>
        <form class="s2-inputs-div">
          <div class="s2-input">
            <label for="description-input">Description</label>
            <input
              type="text"
              placeholder="Enter Description"
              name="description-input"
              id="description-input"
            />
          </div>
          <div class="s2-input">
            <label for="amount-input">Amount</label>

            <input
              type="text"
              placeholder="Enter Description"
              name="amount-input"
              id="amount-input"
            />
          </div>
          <div class="s2-input">
            <label for="category-input">Category</label>
            <select name="category-input" id="category">
              <option value="">Select category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Others">Others</option>
            </select>
          </div>
          <div class="s2-input">
            <label for="date-input">Date</label>

            <input
              type="date"
              placeholder="Enter Description"
              name="date-input"
              id="date-input"
            />
          </div>
          <div class="s2-input-button">
            <button id="submit-btn" type="button">
              <div class="adding-btn">
                <i data-lucide="plus"></i>
                <p>Add Expences</p>
              </div>
            </button>
          </div>
        </form>
      </div>
    </section>

    <section class="section3-categorys">
      <div class="category-div">
        <div class="category-div-p">
          <p>Filter by category :</p>
        </div>
        <div class="category-btn">
          <button id="btn-all">
            <div>All</div>
          </button>
          <button id="btn-food">
            <div class="btn-c"><i data-lucide="utensils"></i> Food</div>
          </button>
          <button id="btn-transport">
            <div class="btn-c"><i data-lucide="bus-front"></i>Transport</div>
          </button>
          <button id="btn-shopping">
            <div class="btn-c"><i data-lucide="shopping-bag"></i>Shopping</div>
          </button>
          <button id="btn-bills">
            <div class="btn-c"><i data-lucide="receipt"></i>Bills</div>
          </button>
          <button id="btn-entertainment">
            <div class="btn-c"><i data-lucide="ticket"></i>Entertainment</div>
          </button>
          <button id="btn-others">
            <div class="btn-c"><i data-lucide="ellipsis"></i>Others</div>
          </button>
        </div>
      </div>
    </section>

    <section class="section4-table">
      <div class="table-container">
        <table class="table-div">
          <tr class="table-heading">
            <th>Description</th>
            <th>Category</th>
            <th>Amount (₹)</th>
            <th>Date</th>
          </tr>
          <tbody id="expense-table-body"></tbody>
        </table>
      </div>
    </section>

    <script src="App.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
